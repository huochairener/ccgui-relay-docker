name = "ccgui-relay"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# Durable Object: one instance per relay key owns the desktop's socket.
[[durable_objects.bindings]]
name = "RELAY"
class_name = "Relay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Relay"]

[vars]
# RELAY_KEY 不再写在这里：它是桌面端与中继之间的唯一鉴权凭据，明文进 git
# 等于发给所有能读仓库的人（且已进入历史，请轮换）。
# 部署时改用密钥命令，读取方式不变（Worker 代码仍读 env.RELAY_KEY）：
#   npx wrangler secret put RELAY_KEY
# RELAY_KEY is no longer stored here: it is the relay's only auth secret and
# must never be committed. Set it with `npx wrangler secret put RELAY_KEY`;
# the code keeps reading env.RELAY_KEY, so nothing else changes.
